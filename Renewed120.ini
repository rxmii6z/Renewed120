[Renewed120]
; ---- display -------------------------------------------------------------------------------------------------
; 1 = borderless windowed fullscreen (no mode switch, no black flash), 0 = exclusive fullscreen.
WindowMode=1
; Exclusive fullscreen only: use the desktop refresh rate instead of the game's fixed 60 Hz.
RefreshRateFix=1
; 0 = use the desktop refresh rate of the monitor. Otherwise force a value in Hz (e.g. 120).
ForceHz=0
; Render frame cap in FPS: 0 = automatic (refresh rate of your monitor), -1 = no cap, or a value (e.g. 120).
FpsCap=0

; ---- simulation / smoothness ---------------------------------------------------------------------------------
; Simulation rate in Hz (0 = off, original behaviour: one logic step per rendered frame).
; With LogicHz=30 the world is simulated 30 times per second and drawn FpsCap times per second.
; Everything below needs LogicHz > 0.
LogicHz=30
; Each tick simulates exactly 1/LogicHz s (removes speed wobble between ticks). 0 = measured real time.
FixedStep=1
; Blend peds/vehicles/objects and the camera between two simulation ticks.
Interpolate=1
; Also blend vehicle parts (wheels, doors, suspension, bike forks) between ticks.
VehicleParts=1
; Also blend the ped skeletons (animations).
PedSkeleton=1
; Also blend the skeletons of cutscene characters.
CutsceneSkeleton=1
; Load the models read from disk on every drawn frame, not only 30 times per second (map/LODs load as fast as the original game).
StreamEveryFrame=1
; Keep vehicle/ped physics untouched by the extra frames drawn between ticks (rear axle wobble, icy sand...).
VehicleGuard=1
; Water drawn and animated on every frame (no blinking sea).
WaterFix=1
; Blood pools and other fixed shadows kept between ticks (no blinking).
StaticShadowFix=1
; Particles (smoke, sparks...) and broken-object pieces animated on every frame.
SmoothFx=1
; Headlight patches on the ground of AI cars recomputed every frame (no jerky light when they drive slowly).
SmoothCarLights=1

; ---- developer -----------------------------------------------------------------------------------------------
; F9 in game opens the developer menu (toggle features live, Enter on Save writes this file).
DevMenu=1
; Write Renewed120.log next to this file.
Log=1
; Write Renewed120.telemetry.csv (FPS, frame times, game timestep, player position/speed, time spent in the mod).
Telemetry=0
