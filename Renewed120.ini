[Renewed120]
; ---- display -------------------------------------------------------------------------------------------------
; 1 = borderless windowed fullscreen (no mode switch, no black flash), 0 = exclusive fullscreen.
WindowMode=1
; Start the game at the resolution of your desktop (you can still change it in the game's menu for the session).
DesktopResolution=1
; Exclusive fullscreen only: use the desktop refresh rate instead of the game's fixed 60 Hz.
RefreshRateFix=1
; 0 = use the desktop refresh rate of the monitor. Otherwise force a value in Hz (e.g. 120).
ForceHz=0
; Render frame cap in FPS: 0 = automatic (refresh rate of your monitor), -1 = no cap, or a value (e.g. 120).
FpsCap=0
; VSync: 1 = wait for the monitor's refresh (no tearing; with FpsCap=0 or -1 the frame rate follows the monitor),
; 0 = off (frames shown as soon as they are ready).
VSync=0
; Turn off the game's own 30 fps frame limiter (it would hide the high frame rate). FpsCap above does the limiting.
NoFrameLimiter=1

; ---- simulation / smoothness ---------------------------------------------------------------------------------
; Simulation rate in Hz (0 = off, original behaviour: one logic step per rendered frame).
; With LogicHz=30 the world is simulated 30 times per second and drawn FpsCap times per second.
; Everything below needs LogicHz > 0.
LogicHz=30
; Each tick simulates exactly 1/LogicHz s (removes speed wobble between ticks). 0 = measured real time.
FixedStep=1
; Blend peds/vehicles/objects and the camera between two simulation ticks.
Interpolate=1
; Experimental. Run the game's camera on every drawn frame instead of blending it between two simulation steps:
; the view answers the mouse / stick on the next frame (no 33 ms lag). Only for the views you steer (on foot, behind
; a vehicle, aiming); cutscenes, the cinematic, idle and scripted cameras keep the blended camera.
CameraEveryFrame=0
; Also blend vehicle parts (wheels, doors, suspension, bike forks) between ticks.
VehicleParts=1
; Also blend the ped skeletons (animations).
PedSkeleton=1
; Also blend the skeletons of cutscene characters.
CutsceneSkeleton=1
; Load the models read from disk on every drawn frame, not only 30 times per second (map/LODs load as fast as the original game).
StreamEveryFrame=1
; Keep vehicle/ped physics untouched by the extra frames drawn between ticks (rear axle wobble, icy sand...).
VehicleGuard=1
; Water drawn and animated on every frame (no blinking sea).
WaterFix=1
; Blood pools and other fixed shadows kept between ticks (no blinking).
StaticShadowFix=1
; Lights of fires, explosions and gunshots, and the lights and shadows drawn by scripts, kept on every frame
; (they were only there on one drawn frame per simulation step: dim, flickering).
LightsEveryFrame=1
; Particles (smoke, sparks...) and broken-object pieces animated on every frame.
SmoothFx=1
; Waves of the sea and spin of pickups (weapons, health...) follow the drawn frames instead of the logic ticks.
SmoothClock=1
; Moving fog drifts at the game's speed whatever the frame rate (it moved once per drawn frame: far too fast at 300 fps).
SmoothFog=1
; Sparks, wheel dust, debris and blood that the simulation emits at each tick appear spread over the drawn frames
; instead of as one burst per tick (sparks leave from the car as drawn, their streak follows the camera every frame).
SmoothSparks=1
; Headlight patches on the ground of AI cars recomputed every frame (no jerky light when they drive slowly).
SmoothCarLights=1
; Sun shadows turn smoothly while the time of day passes, instead of by steps at the logic rate.
SmoothSun=1
; Low visual FX: blob shadows of AI cars recomputed every frame.
SmoothCarShadows=1
; Medium visual FX and above: the shadow volumes of every car, bike and BMX rebuilt every frame.
CarStencilEachFrame=1
; Update the sounds (engines, peds, positions) once per logic tick like the original game, not on every drawn frame.
; Done on the frame right after each tick so the cost is spread out (saves 1-2 ms per frame in traffic).
AudioAtLogicRate=1

; ---- developer -----------------------------------------------------------------------------------------------
; F9 in game opens the developer menu (toggle features live, Enter on Save writes this file).
DevMenu=1
; Write Renewed120.log next to this file.
Log=1
; Write Renewed120.telemetry.csv (FPS, frame times, game timestep, player position/speed, time spent in the mod,
; and the time of each step of the frame: logic, audio, render list, 3D scene, HUD, frame cap wait, Present).
Telemetry=0
