[Renewed120]
; F9 in game opens the developer menu (toggle features live, Enter on Save writes this file).
DevMenu=1
PedSkeleton=1
; Master switch for the refresh rate fix.
RefreshRateFix=1
; 0 = use the desktop refresh rate of the monitor. Otherwise force a value in Hz (e.g. 120).
ForceHz=0
; 1 = borderless windowed fullscreen (no mode switch, no black flash), 0 = exclusive fullscreen.
WindowMode=1
; Render frame cap in FPS (0 = off).
FpsCap=180
; Simulation rate in Hz (0 = off, original behaviour: one logic step per rendered frame).
; With LogicHz=30 the world is simulated 30 times per second and drawn FpsCap times per second.
LogicHz=30
; Blend peds/vehicles/objects and the camera between two simulation ticks (needs LogicHz > 0).
Interpolate=1
; Also blend vehicle parts (wheels, doors, suspension) between ticks.
VehicleParts=1
; Write Renewed120.telemetry.csv (FPS, frame times, game timestep, player position/speed).
Telemetry=1
; Record a long camera/entity blend history to Renewed120.telemetry.csv.camdebug.csv (heavy: causes a hitch every second).
DebugCamera=0
; Write Renewed120.log next to this file.
Log=1
