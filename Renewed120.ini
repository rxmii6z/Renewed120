[Renewed120]
; Renewed120 v0.7 for GTA San Andreas 1.0 US. 1 = on, 0 = off.
; F9 in game opens the developer menu: switch the options live, Save writes this file.

; ---- display ---------------------------------------------------------------------------------------------------
; 0 = exclusive fullscreen, 1 = borderless window (no mode switch).
WindowMode=1
; Start at the resolution of the desktop (it can still be changed in the game's menu).
DesktopResolution=1
; Exclusive fullscreen: use the monitor's refresh rate instead of the game's fixed 60 Hz.
RefreshRateFix=1
; Refresh rate in Hz for exclusive fullscreen, 0 = the desktop's.
ForceHz=0
; Frame cap: 0 = the monitor's refresh rate, -1 = none, or frames per second (e.g. 120).
FpsCap=0
; Wait for the monitor's refresh: no tearing. With FpsCap=0 or -1 the frame rate follows the monitor.
VSync=0
; Remove the game's own 30 fps limiter (FpsCap does the limiting).
NoFrameLimiter=1

; ---- simulation ------------------------------------------------------------------------------------------------
; Simulation steps per second. 0 = the mod's smoothing is off (the game's own behaviour). Everything below needs it.
LogicHz=30
; Each step simulates exactly 1/LogicHz of a second: steady speed.
FixedStep=1
; Draw peds, vehicles, objects and the camera between two steps: the smooth picture.
Interpolate=1
; Experimental. Run the camera on every drawn frame: no 33 ms lag on the mouse / stick. Only for the views you steer
; (on foot, behind a vehicle, aiming); cinematic, idle, first-person, scripted cameras and cutscenes stay blended.
CameraEveryFrame=0

; ---- details: leave them on, switch one off only if it causes a problem -------------------------------------------
; Vehicle parts (wheels, doors, suspension, bike forks).
VehicleParts=1
; Ped animations.
PedSkeleton=1
; Animations of cutscene characters.
CutsceneSkeleton=1
; Load models from disk on every frame (the map appears as fast as in the original game).
StreamEveryFrame=1
; Keep vehicle and ped physics untouched by the frames drawn between steps (wobble, icy ground).
VehicleGuard=1
; Water animated on every frame (no blinking sea).
WaterFix=1
; Blood pools and other fixed shadows kept between steps (no blinking).
StaticShadowFix=1
; Lights of fires, explosions, gunshots and scripts kept on every frame (no dim, flickering lights).
LightsEveryFrame=1
; Particles (smoke, sparks) and pieces of broken objects animated on every frame.
SmoothFx=1
; Waves and the spin of pickups follow the drawn frames.
SmoothClock=1
; Moving fog drifts at the game's speed whatever the frame rate.
SmoothFog=1
; Sparks, dust, debris and blood spread over the drawn frames instead of one burst per step.
SmoothSparks=1
; Headlight patches of AI cars on the ground follow them on every frame.
SmoothCarLights=1
; Sun shadows turn smoothly with the time of day.
SmoothSun=1
; Low visual FX: blob shadows of AI cars follow them on every frame.
SmoothCarShadows=1
; Medium visual FX and above: car, bike and BMX shadows follow them on every frame.
CarStencilEachFrame=1
; Update the sounds once per step like the original game (saves 1-2 ms per frame in traffic).
AudioAtLogicRate=1

; ---- developer -------------------------------------------------------------------------------------------------
; F9 opens the developer menu.
DevMenu=1
; Write Renewed120.log next to this file.
Log=1
; Write Renewed120.telemetry.csv (frame times and the time of each step of the frame), to measure stutter.
Telemetry=0
