# Sends the zip of a GitHub release to Nexus Mods, as a new version of the mod's main file.
#
# Runs when a stable release is published, or when a pre-release is turned into a stable one (GitHub's "released"
# event: pre-releases do not send it), or by hand from the Actions tab with a tag (to retry, or to send a
# pre-release anyway).
#
# Needs the secret NEXUSMODS in the repository settings (Settings > Secrets and variables > Actions): the API
# key of the Nexus account (nexusmods.com > Settings > API Keys).
#
# The mod's id below is the API's own id (/gtasanandreas/mods/3203 on the site). The main file is found from one of its
# versions as the site numbers it (4578, "Renewed120 V0.6", file_id= in its download link): the API's file id is not
# shown on the site.

name: Nexus Mods

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to send (e.g. v0.7)
        required: true

permissions:
  contents: read

concurrency:
  group: nexus
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      NEXUS_MOD_ID: '4101693770883'
      NEXUS_FILE_VERSION: '4578'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Get the release zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "Renewed120-$TAG.zip"
          echo "ZIP=Renewed120-$TAG.zip" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Changelog of this version
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the section "## <tag>" of CHANGELOG.md, without its title, markdown marks removed (Nexus shows plain text)
          notes=$(awk -v tag="$TAG" '
            /^## / { if (on) exit; on = ($2 == tag); next }
            on' CHANGELOG.md | sed -e 's/\*\*//g' -e 's/`//g' -e 's/^#### //' -e 's/^### //')
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then echo "no section $TAG in CHANGELOG.md"; exit 1; fi
          # a GitHub pre-release sent by hand: said first, with the experimental options of the version
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = "true" ]; then
            exp=$(echo "$notes" | grep -i 'experimental' | sed -e 's/^ *- *//' -e 's/:.*//' | sed 's/^/  - /')
            head="TEST VERSION (pre-release): may still have bugs, keep the previous version if something breaks."
            if [ -n "$exp" ]; then
              head=$(printf "%s\n%s\n%s" "$head" "EXPERIMENTAL, off by default, turn on in Renewed120.ini to try:" "$exp")
            fi
            notes=$(printf "%s\n\n%s" "$head" "$notes")
            echo "PRE=1" >> "$GITHUB_ENV"
          fi
          { echo "text<<NEXUS_NOTES_END"; echo "$notes"; echo "NEXUS_NOTES_END"; } >> "$GITHUB_OUTPUT"

      - name: Find the main file on Nexus
        id: file
        env:
          NEXUS_KEY: ${{ secrets.NEXUSMODS }}
        run: |
          id=$(curl -sf -H "apikey: $NEXUS_KEY" -H "User-Agent: Renewed120-release"             "https://api.nexusmods.com/v3/games/gtasanandreas/mod-file-versions/$NEXUS_FILE_VERSION" | jq -r '.data.file.id')
          if [ -z "$id" ] || [ "$id" = "null" ]; then echo "file of version $NEXUS_FILE_VERSION not found"; exit 1; fi
          echo "main file: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2   # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS }}
          mod_id: ${{ env.NEXUS_MOD_ID }}
          file_id: ${{ steps.file.outputs.id }}
          filename: ${{ env.ZIP }}
          version: ${{ env.VERSION }}
          display_name: ${{ env.PRE && 'Renewed120 (test version)' || 'Renewed120' }}
          description: 120 fps and more for GTA San Andreas 1.0 US. Copy Renewed120.asi and Renewed120.ini into scripts.
          category: main
          archive_existing_version: true
          primary_mod_manager_download: true
          update_mod_version: true
          changelog: ${{ steps.notes.outputs.text }}
